<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おすすめYouTubeチャンネル</title>
<meta name="description" content="登録しているYouTubeチャンネルの紹介ページ">
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --line: #e6e6e2;
    --accent: #cc0000;
    --accent-hover: #a80000;
    --tag-bg: #f1f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --card: #1e1e1e;
      --text: #ececec;
      --muted: #a0a0a0;
      --line: #2e2e2e;
      --accent: #ff4e45;
      --accent-hover: #ff6b63;
      --tag-bg: #2a2a2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
    line-height: 1.7;
  }
  header {
    max-width: 1080px;
    margin: 0 auto;
    padding: 56px 16px 24px;
  }
  header h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0 0 8px; letter-spacing: .02em; }
  header p { margin: 0; color: var(--muted); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .filters button {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: .88rem; cursor: pointer;
  }
  .filters button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  main {
    max-width: 1080px; margin: 0 auto; padding: 8px 16px 64px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; display: flex; flex-direction: column; gap: 12px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  .head { display: flex; align-items: center; gap: 14px; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
    background: var(--tag-bg); display: grid; place-items: center;
    font-weight: 700; font-size: 1.5rem; color: var(--muted); overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name { font-size: 1.05rem; font-weight: 700; margin: 0; line-height: 1.4; }
  .tag {
    display: inline-block; margin-top: 4px; font-size: .75rem; color: var(--muted);
    background: var(--tag-bg); border-radius: 6px; padding: 1px 8px;
  }
  .desc { margin: 0; font-size: .92rem; color: var(--muted); flex-grow: 1; }
  .btn {
    align-self: flex-start; text-decoration: none; color: #fff; background: var(--accent);
    padding: 8px 16px; border-radius: 8px; font-size: .88rem; font-weight: 600;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:focus-visible, .filters button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 16px 40px; }
</style>
</head>
<body>
<header>
  <h1>おすすめYouTubeチャンネル</h1>
  <p>いつも見ているチャンネルを紹介します。気になるものがあればぜひ覗いてみてください。</p>
  <div class="filters" id="filters"></div>
</header>

<main id="list"></main>

<footer>各チャンネルの説明は公式の概要欄をもとに要約しています。</footer>

<script>
const channels = [
  { id: "UC-5ztjRXOCpOsJi0xMES52A", name: "ガジェ丸 / iPhoneお得情報", tag: "ガジェット・スマホ",
    desc: "本当にお得なiPhone・スマホ情報を中心に、Apple製品や家電、PC、ガジェットの役立つ情報を発信しています。" },
  { id: "UC3ZyXaDaDyKcFff8l1fI8Og", name: "まーラボ Lab.【格安SIMラボ】", tag: "ガジェット・スマホ",
    desc: "格安SIMのレビューや一括1円端末の情報などを、ゆっくり動画で紹介。スマホ好きにおすすめのチャンネルです。" },
  { id: "UCiUCX_DBkh0-tUr6S7ei1kA", name: "あうあう家のガジェット", tag: "ガジェット・スマホ",
    desc: "ガジェットをいかにコスパよく手に入れるかがテーマ。スマホ・PC・ゲーム関連のお得情報を追いかけています。" },
  { id: "UCISDrqLMNq3w9AZ4otdoRuA", name: "TECH WORLD", tag: "テック・キャリア",
    desc: "日本で働くソフトウェアエンジニアとしての日々やキャリアを発信するチャンネルです。" },
  { id: "UCiMwbmcCSMORJ-85XWhStBw", name: "安野貴博の自由研究", tag: "テック・キャリア",
    desc: "AIエンジニア・起業家・SF作家の安野貴博さんが、自身の活動や考えを発信するチャンネルです。" },
  { id: "UCWJEssGVTIpTwvAZNvd7ILw", name: "ガミデンキちゃんねる", tag: "資格・学び",
    desc: "元電気科講師による電気工事士の資格対策チャンネル。筆記・技能試験のポイントをわかりやすく解説しています。" },
  { id: "UCR5_QGoPom91psBKZ9YPrAQ", name: "生活堂でかんたんリフォーム by ライフワン", tag: "住まい・暮らし",
    desc: "トイレや給湯器、食洗機、ガスコンロなどの住宅設備を、リフォームのプロが選び方から交換方法まで本音で解説します。" },
  { id: "UCmKlo3BXt60nzgk2r_JgvwQ", name: "有隣堂しか知らない世界", tag: "エンタメ・カルチャー",
    desc: "老舗書店・有隣堂のスタッフが、文房具や本など「有隣堂しか知らない」さまざまな世界を愛をこめて紹介します。" },
  { id: "UCfpC7dDq-cFmaj5ILzZ-86g", name: "マロン（漢）", tag: "エンタメ・カルチャー",
    desc: "トイプードルのマロンの日常に、飼い主の実況をつけた動画を投稿している癒やし系チャンネルです。" },
  { id: "UCRkhnqY4vM-gRypgYSsGetA", name: "右派★右派　ずんだタイム", tag: "ニュース・政治",
    desc: "日本の政治を右派の視点から考察するチャンネル。各政党の動きなどを解説しています。" },
];

const list = document.getElementById("list");
const filters = document.getElementById("filters");
const tags = ["すべて", ...new Set(channels.map(c => c.tag))];
let current = "すべて";

function esc(s) {
  return s.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function render() {
  list.innerHTML = channels
    .filter(c => current === "すべて" || c.tag === current)
    .map(c => `
      <article class="card">
        <div class="head">
          <div class="avatar" data-initial="${esc([...c.name][0])}">
            <img src="https://unavatar.io/youtube/${c.id}?fallback=false" alt="" loading="lazy"
                 onerror="this.parentNode.textContent=this.parentNode.dataset.initial">
          </div>
          <div>
            <h2 class="name">${esc(c.name)}</h2>
            <span class="tag">${esc(c.tag)}</span>
          </div>
        </div>
        <p class="desc">${esc(c.desc)}</p>
        <a class="btn" href="https://www.youtube.com/channel/${c.id}" target="_blank" rel="noopener">チャンネルを見る</a>
      </article>`).join("");
}

filters.innerHTML = tags.map(t =>
  `<button type="button" data-tag="${esc(t)}" aria-pressed="${t === current}">${esc(t)}</button>`).join("");
filters.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  current = b.dataset.tag;
  filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x.dataset.tag === current));
  render();
});

render();
</script>
</body>
</html>
